<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#92400e">
  <title>Parami</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #fffaf0; }
    main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: #92400e; font-family: system-ui, sans-serif; text-align: center; }
    img { border-radius: 1.5rem; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    p { margin: 0; font-size: .875rem; }
    .spinner { width: 1.75rem; height: 1.75rem; border: 3px solid #f3dfbf; border-top-color: #92400e; border-radius: 50%; animation: spin .8s linear infinite; }
    a { color: #92400e; }
    button { border: 0; border-radius: .75rem; padding: .75rem 1.25rem; color: white; background: #92400e; font: inherit; cursor: pointer; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main role="status" aria-live="polite" aria-busy="true">
    <img src="/icons/icon-192.png" width="88" height="88" alt="">
    <h1>Parami</h1>
    <span class="spinner" aria-hidden="true"></span>
    <p>Đang tải ứng dụng…</p>
    <noscript><a href="/">Mở Parami</a></noscript>
  </main>
  <script>
    (async function () {
      var target = location.pathname === '/launch.html' ? '/' : location.pathname + location.search;
      try {
        var response = await fetch(target, {
          credentials: 'same-origin', cache: 'no-store',
          signal: AbortSignal.timeout(60000)
        });
        if (!response.ok || !response.headers.get('content-type')?.includes('text/html')) {
          throw new Error('Không tải được trang');
        }
        var html = await response.text();
        var finalUrl = new URL(response.url);
        if (finalUrl.origin !== location.origin) throw new Error('Địa chỉ không hợp lệ');
        history.replaceState(null, '', finalUrl.pathname + finalUrl.search + location.hash);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.querySelector('.spinner').hidden = true;
        document.querySelector('main').setAttribute('aria-busy', 'false');
        document.querySelector('p').textContent = navigator.onLine
          ? 'Tải ứng dụng chưa thành công. Vui lòng thử lại.'
          : 'Không có kết nối mạng. Vui lòng kết nối Internet.';
        var retry = document.createElement('button');
        retry.textContent = 'Thử lại';
        retry.onclick = function () { location.reload(); };
        document.querySelector('main').appendChild(retry);
      }
    })();
  </script>
</body>
</html>
